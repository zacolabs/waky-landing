<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>WAKY 다운로드</title>

  <!-- 공유(카톡/문자/SNS) 미리보기 -->
  <meta property="og:title" content="WAKY — 확실하게 깨워주는 알람" />
  <meta property="og:description" content="미션으로 확실하게 깨는 알람. 지금 설치해 보세요." />
  <meta property="og:type" content="website" />
  <!-- <meta property="og:image" content="https://your-domain/og-image.png" /> -->

  <style>
    :root {
      --bg: #0e1116;
      --card: #171b22;
      --text: #f2f4f8;
      --muted: #9aa4b2;
      --accent: #4f7cff;
      --border: #262c36;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f5f7fb;
        --card: #ffffff;
        --text: #14181f;
        --muted: #5b6472;
        --accent: #3a63f0;
        --border: #e3e8f0;
      }
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      width: 100%;
      max-width: 380px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 32px 24px;
      text-align: center;
      box-shadow: 0 10px 40px rgba(0,0,0,0.15);
    }
    .logo {
      width: 72px; height: 72px;
      border-radius: 18px;
      margin: 0 auto 20px;
      background: linear-gradient(135deg, var(--accent), #7a9bff);
      display: flex; align-items: center; justify-content: center;
      font-size: 34px; font-weight: 800; color: #fff;
    }
    h1 { font-size: 22px; margin: 0 0 8px; }
    p.sub { color: var(--muted); font-size: 14px; margin: 0 0 24px; line-height: 1.5; }
    .btns { display: flex; flex-direction: column; gap: 12px; }
    a.store {
      display: flex; align-items: center; justify-content: center; gap: 10px;
      text-decoration: none;
      padding: 14px 18px;
      border-radius: 12px;
      font-size: 15px; font-weight: 600;
      background: var(--accent); color: #fff;
      border: 1px solid transparent;
      transition: transform .08s ease, opacity .2s ease;
    }
    a.store.secondary {
      background: transparent; color: var(--text);
      border: 1px solid var(--border);
    }
    a.store:active { transform: scale(0.98); }
    .redirecting { color: var(--muted); font-size: 13px; margin-top: 20px; min-height: 18px; }
    svg { width: 20px; height: 20px; fill: currentColor; }
  </style>
</head>
<body>
  <main class="card">
    <div class="logo">W</div>
    <h1>WAKY 다운로드</h1>
    <p class="sub">사용 중인 기기의 스토어로 이동합니다.<br />자동으로 이동하지 않으면 아래 버튼을 눌러주세요.</p>

    <div class="btns">
      <a id="ios" class="store" href="#" rel="noopener">
        <svg viewBox="0 0 24 24"><path d="M16.36 12.9c-.02-2.06 1.68-3.05 1.76-3.1-.96-1.4-2.45-1.6-2.98-1.62-1.27-.13-2.48.75-3.12.75-.64 0-1.64-.73-2.7-.71-1.39.02-2.67.81-3.38 2.05-1.44 2.5-.37 6.2 1.03 8.23.69.99 1.5 2.1 2.57 2.06 1.03-.04 1.42-.66 2.67-.66 1.24 0 1.6.66 2.69.64 1.11-.02 1.81-1 2.49-2 .78-1.15 1.1-2.26 1.12-2.32-.02-.01-2.15-.82-2.17-3.27zM14.3 6.8c.57-.69.95-1.65.85-2.6-.82.03-1.81.55-2.39 1.23-.52.61-.98 1.58-.86 2.51.91.07 1.84-.46 2.4-1.14z"/></svg>
        App Store에서 받기
      </a>
      <a id="android" class="store secondary" href="#" rel="noopener">
        <svg viewBox="0 0 24 24"><path d="M17.6 9.48l1.84-3.18a.4.4 0 0 0-.7-.4l-1.87 3.23A11.4 11.4 0 0 0 12 8.2c-1.7 0-3.32.34-4.77.93L5.36 5.9a.4.4 0 1 0-.7.4L6.5 9.48A10 10 0 0 0 2 17h20a10 10 0 0 0-4.4-7.52zM7.2 14.4a1 1 0 1 1 0-2 1 1 0 0 1 0 2zm9.6 0a1 1 0 1 1 0-2 1 1 0 0 1 0 2z"/></svg>
        Google Play에서 받기
      </a>
    </div>

    <p class="redirecting" id="status"></p>
  </main>

  <script>
    // ── 스토어 링크 (배포 시 여기만 채우면 됩니다) ────────────────
    var IOS_URL = "https://apps.apple.com/app/idXXXXXXXXXX";       // App Store 앱 ID로 교체
    var ANDROID_URL = "https://play.google.com/store/apps/details?id=com.waky.app"; // 패키지명으로 교체
    var FALLBACK_URL = "";  // 데스크톱 등 그 외 기기에서 보낼 곳(비우면 이 페이지에 머무름)
    // ──────────────────────────────────────────────────────────

    document.getElementById("ios").href = IOS_URL;
    document.getElementById("android").href = ANDROID_URL;

    function detectPlatform() {
      var ua = navigator.userAgent || navigator.vendor || window.opera || "";
      // iPadOS 13+ 는 Mac으로 위장 → 터치 지원 여부로 보정
      var isIOS = /iPad|iPhone|iPod/.test(ua) ||
                  (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
      if (isIOS) return "ios";
      if (/android/i.test(ua)) return "android";
      return "other";
    }

    (function redirect() {
      var status = document.getElementById("status");
      var platform = detectPlatform();
      var target = platform === "ios" ? IOS_URL
                 : platform === "android" ? ANDROID_URL
                 : FALLBACK_URL;

      if (target) {
        status.textContent = "스토어로 이동 중…";
        // replace: 뒤로가기 시 이 페이지가 히스토리에 남지 않도록
        window.location.replace(target);
      } else {
        status.textContent = "받고 싶은 버전을 선택하세요.";
      }
    })();
  </script>
</body>
</html>
